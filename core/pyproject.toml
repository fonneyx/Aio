[project]
name = "aio-grab"
dynamic = ["version"]
description = "Download video, audio and images from YouTube and 1,000+ sites with one call. A friendly layer over yt-dlp, gallery-dl and ffmpeg."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "fonneyx" }]
requires-python = ">=3.12"
keywords = ["downloader", "yt-dlp", "youtube", "video", "audio", "mp3", "gallery-dl", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "gallery-dl>=1.32.17",
    "static-ffmpeg>=3.0",
    "yt-dlp[curl-cffi,default]>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/fonneyx/Aio"
Issues = "https://github.com/fonneyx/Aio/issues"

[project.scripts]
aio-grab = "aio_grab.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aio_grab/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
